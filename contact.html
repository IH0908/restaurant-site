<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Bistro | Home</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a href="index.html" class="logo">Urban Bistro</a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="menu.html" class="nav-link">Menu</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <div class="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </nav>
  </header>

<main class="page">
  <section class="page-header">
    <h1>Contact Us</h1>
    <p>Have a question or want to book a table? Reach out below.</p>
  </section>

  <section class="contact-layout container">
    <!-- Google Map -->
    <div class="map-container">
      <!-- Replace the src with the embed link for your chosen address -->
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.992915...etc"
        width="100%"
        height="350"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <!-- Contact form -->
    <div class="contact-form">
      <h2>Send us a message</h2>
      <form>
        <label for="name">Name</label>
        <input id="name" type="text" name="name" required />

        <label for="email">Email</label>
        <input id="email" type="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Submit</button>
      </form>
    </div>
  </section>
</main>


  <footer class="footer">
    <div class="footer-social">
      <a href="#" aria-label="Facebook"><i class="fa fa-facebook"></i></a>
      <a href="#" aria-label="Instagram"><i class="fa fa-instagram"></i></a>
      <a href="#" aria-label="Twitter"><i class="fa fa-twitter"></i></a>
    </div>
    <div class="footer-hours">
      <p>Mon–Thu: 11:00 AM – 9:00 PM</p>
      <p>Fri–Sat: 11:00 AM – 11:00 PM</p>
      <p>Sun: 12:00 PM – 8:00 PM</p>
    </div>
    <p class="footer-copy">&copy; 2026 Urban Bistro. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
